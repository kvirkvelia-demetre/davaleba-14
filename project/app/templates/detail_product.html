{% extends 'base.html' %}


{% block content %}

<div class="container">

    <div class="product-detail">

        <h1>
            {{ product.name }}
        </h1>

        <p class="price">
            ${{ product.price }}
        </p>

        <p class="description">
            {{ product.description }}
        </p>

        <a
            class="back-button"
            href="{% url 'products' %}"
        >
            Back to Products
        </a>

    </div>

</div>

{% endblock %}
