{% extends 'base.html' %}


{% block content %}

<div class="container">

    <h1 class="title">
        Our Products
    </h1>

    <div class="products">

        {% for product in products %}

        <div class="product-card">

            <h2>
                {{ product.name }}
            </h2>

            <p class="price">
                ${{ product.price }}
            </p>

            <a
                class="details-button"
                href="{% url 'detail_product' product.id %}"
            >
                View Product
            </a>

        </div>

        {% endfor %}

    </div>

</div>

{% endblock %}
